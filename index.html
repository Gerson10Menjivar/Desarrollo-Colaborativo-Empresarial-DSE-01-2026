<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Gestión de Inventario</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    min-height: 100vh;
}

.navbar {
    background: linear-gradient(90deg, #0d6efd, #0b5ed7);
}

.navbar-brand {
    font-weight: 600;
    color: white !important;
}

.card {
    border: none;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container-fluid px-4">

<span class="navbar-brand">
<i class="bi bi-box-seam"></i> Sistema de Inventario
</span>

<div>
<button class="btn btn-light me-2" onclick="mostrarSeccion('formulario')">
<i class="bi bi-pencil-square"></i> Formulario
</button>

<button class="btn btn-light" onclick="mostrarSeccion('lista')">
<i class="bi bi-list-ul"></i> Inventario
</button>
</div>

</div>
</nav>

<div class="container mt-4">

<!-- FORMULARIO -->
<div id="formularioSection" class="card p-4 mb-4">

<h5>Registro / Actualización de Producto</h5>

<div class="row">

<div class="col-md-6 mb-3">
<label>Nombre</label>
<input type="text" id="nombre" class="form-control">
</div>

<div class="col-md-3 mb-3">
<label>Precio</label>
<input type="number" id="precio" class="form-control">
</div>

<div class="col-md-3 mb-3">
<label>Stock</label>
<input type="number" id="stock" class="form-control">
</div>

</div>

<div class="mb-3">
<label>Descripción</label>
<input type="text" id="descripcion" class="form-control">
</div>

<div class="mb-3">
<label>Categoría</label>
<select id="categoria" class="form-select">
<option value="">Seleccione categoría</option>
<option value="Tecnología">Tecnología</option>
<option value="Hogar">Hogar</option>
<option value="Ropa">Ropa</option>
<option value="Alimentos">Alimentos</option>
</select>
</div>

<button class="btn btn-primary w-100" onclick="agregarProducto()">
Guardar Producto
</button>

</div>

<!-- LISTA -->
<div id="listaSection" class="card p-4" style="display:none;">

<h5>Inventario de Productos</h5>

<!-- BUSQUEDA Y FILTRO -->
<div class="row mb-3">

<div class="col-md-6">
<input 
type="text"
id="busqueda"
class="form-control"
placeholder="🔎 Buscar producto por nombre..."
onkeyup="filtrarProductos()">
</div>

<div class="col-md-6">
<select 
id="filtroCategoria"
class="form-select"
onchange="filtrarProductos()">

<option value="">Todas las categorías</option>
<option value="Tecnología">Tecnología</option>
<option value="Hogar">Hogar</option>
<option value="Ropa">Ropa</option>
<option value="Alimentos">Alimentos</option>

</select>
</div>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>
<tr>
<th>Producto</th>
<th>Precio</th>
<th>Stock</th>
<th>Descripción</th>
<th>Categoría</th>
<th>Estado</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaProductos"></tbody>

</table>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
